# yaml-language-server: $schema=https://www.rubyschema.org/rubocop.json
---
# Lint against the oldest supported Ruby without extension suggestions.
AllCops:
  Exclude:
    - "bin/*"
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2

# RubyGems credentials enforce MFA outside the gemspec.
Gemspec/RequireMFA:
  Enabled: false

# Keep related guard clauses together.
Layout/EmptyLineAfterGuardClause:
  Enabled: false

Layout/EndAlignment:
  EnforcedStyleAlignWith: variable

Layout/FirstArrayElementLineBreak:
  Enabled: true

Layout/FirstHashElementLineBreak:
  Enabled: true

Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/FirstMethodParameterLineBreak:
  Enabled: true

# Other cops handle long code. Comments and generated constants may exceed 110.
Layout/LineLength:
  AllowedPatterns:
    - "^\\s*#.*$"
    - ^require(_relative)?
    - "XTwitterScraper::Internal::Type::BaseModel$"
    - "^\\s*[A-Z0-9_]+ = :"
    - "XTwitterScraper::(Models|Resources|Test)::"
  Max: 110

Layout/MultilineArrayLineBreaks:
  Enabled: true

Layout/MultilineAssignmentLayout:
  EnforcedStyle: same_line

Layout/MultilineHashKeyLineBreaks:
  Enabled: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

Layout/MultilineMethodParameterLineBreaks:
  Enabled: true

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space
  Exclude:
    - "**/*.rbi"

Lint/BooleanSymbol:
  Enabled: false

# Preserve generated RBI identifiers.
Lint/DeprecatedConstants:
  Exclude:
    - "**/*.rbi"

# Tests use pattern assertions for behavioral checks.
Lint/DuplicateMatchPattern:
  Exclude:
    - "test/**/*"

# Allow empty pattern branches in those assertions.
Lint/EmptyInPattern:
  Exclude:
    - "test/**/*"

Lint/MissingCopEnableDirective:
  Exclude:
    - "examples/**/*.rb"

Lint/MissingSuper:
  Exclude:
    - "**/*.rbi"

Lint/SymbolConversion:
  Exclude:
    - "**/*.rbi"

# Autocorrection can change behavior.
Lint/UnusedMethodArgument:
  AutoCorrect: false

# Autocorrection can remove intentional assignments.
Lint/UselessAssignment:
  AutoCorrect: false
  Exclude:
    - "examples/**/*.rb"

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  AllowedPatterns:
    - assert_pattern
    - type_alias
    - define_sorbet_constant!
  Exclude:
    - "**/*.rbi"

Metrics/ClassLength:
  Enabled: false

Metrics/CollectionLiteralLength:
  Exclude:
    - "test/**/*"

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

# Preserve block names in generated documentation.
Naming/BlockForwarding:
  Enabled: false

# Keep underscores that disambiguate generated names.
Naming/ClassAndModuleCamelCase:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Naming/PredicatePrefix:
  Exclude:
    - "**/*.rbi"

Naming/VariableNumber:
  Enabled: false

Style/AccessModifierDeclarations:
  Enabled: false

Style/AccessorGrouping:
  Exclude:
    - "**/*.rbi"

# Keep alias behavior predictable across scopes.
Style/Alias:
  EnforcedStyle: prefer_alias_method

# Avoid the ambiguous precedence of `and` and `or`.
Style/AndOr:
  EnforcedStyle: always

Style/ArgumentsForwarding:
  Enabled: false

Style/BisectedAttrAccessor:
  Exclude:
    - "**/*.rbi"

# Library code nests modules. Tests use compact names.
Style/ClassAndModuleChildren:
  Exclude:
    - "test/**/*"

Style/CommentAnnotation:
  Enabled: false

# API references supply generated class documentation.
Style/Documentation:
  Enabled: false

# Preserve explicit empty branches when they clarify control flow.
Style/EmptyElse:
  Enabled: false

Style/EmptyMethod:
  Exclude:
    - "**/*.rbi"

# Allow direct environment access in generated client code.
Style/FetchEnvVar:
  Enabled: false

# Prevent mutation of internal strings.
Style/FrozenStringLiteralComment:
  EnforcedStyle: always
  Exclude:
    - "**/*.rbi"

# Keep imperative branches expanded.
Style/IfUnlessModifier:
  Enabled: false

# Preserve generated single-line lambdas.
Style/Lambda:
  Enabled: false

# Prefer consistency in method calling syntax.
Style/MethodCallWithArgsParentheses:
  AllowedMethods:
    - raise
  Enabled: true
  Exclude:
    - "**/*.gemspec"

Style/MultilineBlockChain:
  Enabled: false

Style/MultipleComparison:
  Enabled: false

Style/MutableConstant:
  Exclude:
    - "**/*.rbi"

Style/NumberedParameters:
  Enabled: false

Style/NumberedParametersLimit:
  Max: 2

# Allow brackets around long error messages.
Style/RaiseArgs:
  Enabled: false

# Keep explicit `RuntimeError` names.
Style/RedundantException:
  Enabled: false

Style/RedundantInitialize:
  Exclude:
    - "**/*.rbi"

Style/RedundantParentheses:
  Exclude:
    - "**/*.rbi"

# Prefer slashes for regex literals.
Style/RegexpLiteral:
  EnforcedStyle: slashes

# Keep imperative conditionals explicit.
Style/SafeNavigation:
  Enabled: false

Style/SignalException:
  Exclude:
    - Rakefile
    - "**/*.rake"

# Preserve nested conditions that may gain branches.
Style/SoleNestedConditional:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

# Keep symbol arrays searchable.
Style/SymbolArray:
  EnforcedStyle: brackets

# Keep examples readable for new Ruby users.
Style/SymbolProc:
  Exclude:
    - "examples/**/*.rb"
