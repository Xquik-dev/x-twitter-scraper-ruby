name: Publish Gem

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-gem-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    environment: rubygems
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
          ruby-version: "4.0"

      - name: Publish to RubyGems.org
        uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1.4.0
        with:
          await-release: "false"

      - name: Verify the published version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag is unsupported. Use a semantic version tag."
            exit 1
          fi

          for attempt in {1..30}; do
            if curl --connect-timeout 5 --fail --max-time 10 --silent \
              "https://rubygems.org/api/v2/rubygems/x-twitter-scraper/versions/${release_version}.json" \
              >/dev/null; then
              echo "RubyGems.org published version ${release_version}."
              exit 0
            fi
            if (( attempt < 30 )); then
              sleep 5
            fi
          done

          echo "RubyGems.org lacks version ${release_version}. Retry publication verification."
          exit 1
